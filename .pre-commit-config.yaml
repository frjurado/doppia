repos:
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
  - repo: local
    hooks:
      - id: seed-dry-run
        name: Validate seed YAML (dry-run)
        # language: python (not system) so the hook runs in its own cached
        # env. Under `system` the entry resolved whatever `python` came first
        # on PATH — on a dev machine that is rarely the backend venv, so every
        # seed-YAML commit failed with ModuleNotFoundError: No module named
        # 'yaml'. The deps below are scripts/seed.py's module-level import
        # chain (yaml, pydantic, and neo4j via backend.graph.queries.seed);
        # keep them pinned to backend/requirements.txt.
        language: python
        additional_dependencies:
          - pyyaml==6.0.2
          - pydantic==2.10.3
          - neo4j==5.26.0
        entry: python scripts/seed.py --all --dry-run
        files: ^backend/seed/domains/.*\.yaml$
        pass_filenames: false
