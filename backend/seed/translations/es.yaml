# Spanish translation overlay (ADR-006; Component 12 Step 19b).
#
# status: reviewed — an AI first pass, revised by Francisco 2026-09-06.
# `authoritative` is reserved for content adapted to the Spanish-language
# theoretical tradition rather than rendered into Spanish (ADR-006 § status),
# which this is not yet.
#
# English is NOT written from here. It comes from the domain YAML files, and a
# translations/en.yaml is rejected by the loader so the two cannot disagree.
#
# Stub concepts carry no `definition`. Theirs is boilerplate ("Stub: defined in
# the … domain"), the UI suppresses it, and translating it would only make the
# placeholder look like content. Their names are translated because those do
# show — in value labels like "Cierra un Antecedente".
#
# ── Settled terminology ─────────────────────────────────────────────────────
# The terms where Spanish usage divides, and what this corpus uses. Recorded so
# a later pass extends the vocabulary rather than re-deciding it.
#
#   Sentence      → "Sentencia" (Francisco). Avoids the collision with
#                   *phrase* = frase, which this vocabulary also needs
#                   (PhraseClosure vs ThemeClosure).
#   Applied Dominant → "Dominante Secundaria" (Francisco), the standard term in
#                   Spanish pedagogy, in preference to the calque
#                   "dominante aplicada". Carried through the prose: "V
#                   secundaria", "dominantes secundarias de V".
#   Cadential 6-4 → "6-4 Cadencial" for the property schema, "Sexta-Cuarta
#                   Cadencial" for the harmonic-functions concept — mirroring
#                   English, which likewise spells the concept out
#                   ("Cadential Six-Four") and abbreviates the schema
#                   ("Cadential 6-4"). Not an inconsistency.
#   Reopened HC   → "Semicadencia Reabierta" / "SC (reabierta)".
#   Deceptive     → "Cadencia Rota". "Interrumpida" and "de engaño" circulate.
#   Evaded        → "Cadencia Evitada".
#   Way Station   → "Estación de Paso". A metaphor with no settled Spanish
#                   equivalent; this is a literal rendering.
#   Closing Section → "Sección Conclusiva".
#   Standing on the Dominant → "Permanencia sobre la Dominante".
#
# Descriptions cross-reference concepts by their translated name, so renaming a
# concept here means grepping the prose for the old one.

language: es
status: reviewed

concepts:
  # ── cadences ──────────────────────────────────────────────────────────────
  - id: Cadence
    name: "Cadencia"
    definition: >-
      Un cierre que marca el final de un tema, o de una frase dentro de él, en
      la música tonal. Una cadencia avanza normalmente a través de una secuencia
      de etapas armónicas (tónica inicial, predominante, dominante) hacia un
      punto de llegada. La morfología concreta y el resultado del cierre
      determinan el subtipo de cadencia. Referencia: Caplin, W. (2024).
      Cadence: A Study of Closure in Tonal Music. Oxford University Press.

  - id: AuthenticCadence
    name: "Cadencia Auténtica"
    definition: >-
      Una cadencia cuya dominante se dirige hacia un evento de tónica final.
      Incluye tanto las formas realizadas (CAP, CAI) como las desviaciones
      respecto de la resolución esperada (rota, evitada, abandonada).

  - id: AuthenticCadenceRealised
    name: "Cadencia Auténtica (Realizada)"
    definition: >-
      Una Cadencia Auténtica en la que la tónica final esperada llega
      efectivamente. Lo que la distingue de los subtipos de desviación es
      morfológico: la cadencia alcanza una tónica en estado fundamental en el
      punto de llegada.

  - id: PerfectAuthenticCadence
    name: "Cadencia Auténtica Perfecta"
    aliases:
      - CAP
    definition: >-
      Una Cadencia Auténtica realizada en la que la voz superior llega al
      grado 1 y tanto V como I están en estado fundamental. El cierre
      cadencial más fuerte del sistema tonal.

  - id: ImperfectAuthenticCadence
    name: "Cadencia Auténtica Imperfecta"
    aliases:
      - CAI
    definition: >-
      Una Cadencia Auténtica realizada cuya voz superior llega al grado 3 en
      lugar del grado 1. Más débil que una CAP; característica del antecedente
      de un período, o de una Estación de Paso hacia una CAP posterior. Una
      llegada al grado 5 es sumamente excepcional en el estilo clásico, y ese
      pasaje suele admitir otra escucha, por ejemplo como CAP cubierta.

  - id: DeceptiveCadence
    name: "Cadencia Rota"
    aliases:
      - Cad.Rota
    definition: >-
      Una Cadencia Auténtica cuya dominante resuelve en un acorde sustituto
      (lo más común, VI, aunque son posibles otros) en lugar de la tónica
      esperada. El gesto cadencial es morfológicamente completo hasta la
      dominante; la sustitución se produce en la llegada cadencial. No debe
      confundirse con una Cadencia Evitada: la llegada de la Cadencia Rota es
      el último evento del gesto, mientras que la llegada que habría tenido la
      Cadencia Evitada queda interrumpida por un nuevo comienzo.

  - id: EvadedCadence
    name: "Cadencia Evitada"
    aliases:
      - Cad.Evit.
    definition: >-
      Una Cadencia Auténtica cuya tónica final nunca llega: en el momento en que
      se la espera comienza una nueva idea o frase, de modo que el evento que
      ocupa ese lugar pertenece a lo que sigue en vez de cerrar lo anterior. Ese
      evento suele ser I6, pero casi cualquier armonía puede ocupar el lugar,
      incluso una tónica en estado fundamental. Una cadencia evitada suele dar
      pie a una repetición del material precedente (la técnica del "one more
      time") que vuelve a intentar la cadencia. No debe confundirse con una
      Cadencia Rota, cuya armonía sustituta se oye como el último evento de la
      cadencia.

  - id: AbandonedCadence
    name: "Cadencia Abandonada"
    aliases:
      - Aband.
    definition: >-
      Una Cadencia Auténtica cuya progresión se abandona antes de alcanzar su
      meta: la dominante en estado fundamental pasa a una inversión, la dominante
      llega ya invertida, o la predominante no conduce a ninguna dominante
      cadencial. Puede no haber un único momento de llegada, sino solo un punto
      en el que el movimiento cadencial se detiene. Mientras que la Cadencia
      Evitada falla en la llegada, la Cadencia Abandonada falla en la dominante.

  - id: HalfCadence
    name: "Semicadencia (General)"
    definition: >-
      Una cadencia que llega a la dominante en lugar de a la tónica. El gesto
      cadencial cierra sobre la dominante cadencial, que es el punto de llegada
      y no una preparación para una resolución posterior. Incluye la
      Semicadencia propiamente dicha y la Llegada a la Dominante como desviación
      cadencial.

  - id: HalfCadenceRealised
    name: "Semicadencia"
    aliases:
      - SC
    definition: >-
      Una cadencia que termina en una dominante en estado fundamental, sin
      séptima, alcanzada mediante una progresión cadencial —es decir, precedida
      por una tónica inicial o por una función predominante—. La dominante cierra
      su grupo y se oye como meta, no como armonía penúltima; una séptima o una
      inversión posteriores a la llegada no la anulan. No debe confundirse con
      una Llegada a la Dominante, en la que algunos de estos rasgos no están
      presentes.

  - id: DominantArrival
    name: "Llegada a la Dominante"
    aliases:
      - Lleg.Dom.
    definition: >-
      Una desviación de la Semicadencia: una unidad termina en la dominante sin
      formar una semicadencia genuina. O bien la dominante final de una
      progresión cadencial lleva séptima, o bien la dominante es la última armonía
      de una progresión que prolonga o secuencia en lugar de cadenciar, y en ese
      caso puede incluso estar invertida. Cuando la dominante llega antes de que
      la melodía, la estructura de frase y la textura hayan seguido su curso, la
      llegada es prematura, y entonces incluso una tríada en estado fundamental
      cuenta como Llegada a la Dominante.

  - id: ReopeningHalfCadence
    name: "Semicadencia Reabierta"
    aliases:
      - "SC (reabierta)"
    definition: >-
      Una Semicadencia que deshace retrospectivamente el cierre de una Cadencia
      Auténtica o Rota precedente: la cadencia anterior parece cerrar, pero una
      llegada posterior a la dominante reabre el proceso cadencial y asume el
      peso cadencial.

  - id: ClosingSection
    name: "Sección Conclusiva"
    definition: >-
      Una sección poscadencial que sigue a una Cadencia Auténtica realizada y
      que prolonga la tónica con material conclusivo antes de que comience la
      frase o el tema siguiente. Se distingue de un tema nuevo por su
      dependencia retórica y armónica de la cadencia anterior: se oye como algo
      que viene después de un final, no como un nuevo comienzo, y su armonía
      prolonga la tónica recién alcanzada.

  - id: StandingOnTheDominant
    name: "Permanencia sobre la Dominante"
    definition: >-
      Una sección poscadencial que sigue a una Semicadencia y que prolonga la
      dominante, típicamente como cierre de una transición o al final de la
      sección de desarrollo.

  # Cadence stages (CONTAINS targets).
  - id: CadentialInitialTonic
    name: "Tónica Inicial"
    definition: >-
      Etapa 1 de una cadencia: la región inicial de tónica desde la que parte
      el movimiento cadencial. Puede consistir únicamente en una armonía de
      tónica, en un sustituto de la tónica (VI), en una dominante secundaria de
      la predominante, o en una sucesión de estos.

  - id: CadentialPreDominant
    name: "Predominante"
    definition: >-
      Etapa 2 de una cadencia: la función predominante que precede a la
      dominante cadencial. Puede incluir el grado 4, con frecuencia en el bajo
      (familia de la subdominante: IV, ii, ii6, …), el grado 4 elevado
      (dominantes secundarias de V, sextas aumentadas), o ambos en sucesión.

  - id: CadentialDominant
    name: "Dominante"
    definition: >-
      Etapa 3 de una cadencia: la dominante cadencial, un V o V7 en estado
      fundamental, opcionalmente precedido por una sexta-cuarta cadencial. En una
      Semicadencia es el punto de llegada y debe ser una tríada; en una Cadencia
      Auténtica prepara la tónica final (etapa 4). Una dominante invertida no es
      cadencial y, por tanto, no es esta etapa: una Cadencia Abandonada o una
      Llegada a la Dominante construidas sobre ella no tienen etapa 3.

  - id: CadentialFinalTonic
    name: "Tónica Final"
    definition: >-
      Etapa 4 de una cadencia: la llegada a la tónica en una Cadencia Auténtica
      (o el acorde sustituto en una Cadencia Rota). Ausente en las
      semicadencias y en las Cadencias Auténticas evitadas o abandonadas.

  # ── formal-function (stubs: name only) ────────────────────────────────────
  - id: MainTheme
    name: "Tema Principal"
  - id: SubordinateTheme
    name: "Tema Subordinado"
  - id: Transition
    name: "Transición"
  - id: Coda
    name: "Coda"
  - id: Period
    name: "Período"
  - id: Sentence
    name: "Sentencia"           # see header § Settled terminology
  - id: HybridTheme
    name: "Tema Híbrido"
  - id: Antecedent
    name: "Antecedente"
  - id: Consequent
    name: "Consecuente"
  - id: Continuation
    name: "Continuación"

  # ── harmonic-functions (stubs: name only) ─────────────────────────────────
  - id: Tonic
    name: "Tónica"
  - id: TonicSubstitute
    name: "Sustituto de la Tónica"
  - id: AppliedDominant
    name: "Dominante Secundaria"   # see header § Settled terminology
  - id: CadentialSixFour
    name: "Sexta-Cuarta Cadencial"
  - id: SD4Predominant
    name: "Predominante sobre el Grado 4"
  - id: SDSharp4Predominant
    name: "Predominante sobre el Grado 4 Elevado"

  # ── prolongation (stub: name only) ────────────────────────────────────────
  - id: ContrapuntalCadence
    name: "Cierre Prolongacional"
    aliases:
      - "Cadencia Contrapuntística"

property_schemas:
  - id: CadenceFunction
    name: "Función Cadencial"
    description: >-
      El peso funcional de la cadencia dentro de su contexto formal. Mutuamente
      excluyentes; cada valor lleva su propia descripción.

  - id: PhraseClosure
    name: "Cierre de Frase"
    description: >-
      La unidad formal de nivel frásico que cierra esta cadencia. Solo tiene
      sentido cuando la Función Cadencial es Independiente. Se admiten varios
      valores (por ejemplo, una cadencia que cierra a la vez un Período y el
      Consecuente). Cada valor remite a un stub de Función Formal.
      Deliberadamente restringido a un subconjunto caplineano estable.

  - id: ThemeClosure
    name: "Cierre de Tema"
    description: >-
      La unidad formal de nivel temático que cierra esta cadencia. Solo tiene
      sentido cuando la Función Cadencial es Independiente. Se admiten varios
      valores. Cada valor remite a un stub de Función Formal. Deliberadamente
      restringido a un subconjunto caplineano estable.

  - id: ECP
    name: "Progresión Cadencial Expandida"
    description: >-
      Verdadero cuando la función cadencial abarca al menos una frase completa.
      Como regla práctica: cuatro compases reales o más para las cadencias
      auténticas y rotas, tres o más para las semicadencias y las cadencias
      evitadas, contando la etapa final como un compás. Confírmalo cuando los
      compases reales y los escritos no coincidan.

  - id: Elided
    name: "Elidida"
    description: >-
      Verdadero cuando la llegada cadencial es también el primer evento de la
      unidad siguiente, de modo que el final de una unidad y el comienzo de la
      otra coinciden. Se aplica a las cadencias realizadas y rotas (una cadencia
      rota elidida agrupa hacia atrás y hacia delante). Una cadencia evitada
      nunca es elidida: su llegada frustrada pertenece solo a lo que sigue.

  - id: Covered
    name: "Cubierta"
    description: >-
      Verdadero cuando una cadencia auténtica perfecta elidida queda oculta por
      la primera nota melódica de la unidad siguiente (normalmente el grado 3 o
      5), que suena por encima del grado 1 cadencial y hace que la CAP parezca
      una CAI. Incluye también el caso inverso: una CAI cuyo grado 3 queda
      cubierto por el 1.

  - id: Cadential64
    name: "6-4 Cadencial"
    description: >-
      Verdadero cuando la dominante cadencial (etapa 3) viene precedida por
      una elaboración de sexta-cuarta cadencial. Se modela como BOOL y no como
      un valor dentro de un grupo de elaboraciones porque la sexta-cuarta
      cadencial es casi una subetapa de la dominante, estructuralmente
      distinta de las elaboraciones heterogéneas. Cualquier futura elaboración
      de la etapa 3 recibirá su propio BOOL con nombre propio (por ejemplo, un
      pedal de dominante). El concepto Sexta-Cuarta Cadencial del dominio de
      funciones armónicas es su contrapartida estructural.

  - id: Premature
    name: "Prematura"
    description: >-
      Verdadero cuando la dominante llega antes de que los procesos melódicos,
      de estructura de frase (por ejemplo, la fragmentación) y de textura
      vigentes hayan seguido su curso, de modo que la música queda detenida en la
      dominante antes de lo esperado. Se aplica a dominantes finales y terminales,
      y también a una tríada en estado fundamental que de otro modo se leería
      como semicadencia: ese caso se etiqueta como Llegada a la Dominante con
      Prematura.

  - id: ReinterpretedAsHC
    name: "Reinterpretada como Semicadencia"
    description: >-
      Verdadero cuando una cadencia auténtica cierra en la región de la dominante
      y, al regresar de inmediato la tonalidad principal, se oye
      retrospectivamente como una semicadencia en esa tonalidad. El caso de dos
      eventos, en el que una semicadencia posterior e independiente deshace el
      cierre de la Cadencia Auténtica, se modela como el concepto Semicadencia
      Reabierta, no como esta propiedad.

  - id: HalfCadenceShape
    name: "Perfil de la Semicadencia"
    description: >-
      Cómo se aproxima el bajo a la dominante. Simple (I-V): sin predominante.
      Convergente: el bajo asciende al grado 5 (pasando por el 4 y a menudo por
      el 4 elevado) mientras la melodía desciende. Expansiva: el bajo desciende
      al 5 (desde el 6 o el 6 rebajado) mientras la melodía asciende. MANY_OF
      porque un intercambio de voces puede convertir una en otra dentro de la
      predominante.

  - id: IACSopranoDegree
    name: "Grado de la Soprano en la CAI"
    description: >-
      El grado de la escala de la melodía en la llegada de una CAI. Lo normal es
      el grado 3. El grado 5 es sumamente excepcional en el estilo clásico:
      considera primero una CAP cubierta y da el argumento en el comentario.

  - id: PrinnerCadence
    name: "Cadencia Prinner"
    description: >-
      Verdadero cuando una CAI lleva una melodía Prinner (grados 6-5-4-3) sobre
      un bajo cadencial estándar (4-5-1). Frecuente en el estilo galante.

  - id: DeceptiveSD3
    name: "Cadencia Rota (3̂)"
    description: >-
      Verdadero cuando la melodía de una cadencia rota termina en el grado 3 en
      lugar del 1, de modo que se desvía de una CAI implícita, no de una CAP.

  - id: Stage1Components
    name: "Componentes de la Etapa 1"
    description: >-
      Las entidades armónicas presentes en la etapa 1 (Tónica Inicial) de la
      cadencia. Se admiten varios valores. Cada valor remite a un stub de
      Función Armónica.

  - id: Stage2Components
    name: "Componentes de la Etapa 2"
    description: >-
      Las entidades armónicas presentes en la etapa 2 (Predominante) de la
      cadencia. Se admiten varios valores. Cada valor remite a un stub de
      Función Armónica.

property_values:
  # CadenceFunction
  - id: Independent
    name: "Independiente"
    description: >-
      La cadencia cierra su unidad por derecho propio y no ocupa el lugar de una
      CAP.
  - id: WayStation
    name: "Estación de Paso"    # TERM — see header
    description: >-
      La cadencia aparece donde se espera una CAP y aplaza ese cierre, llegue o no
      la CAP finalmente.
  - id: LimitedScope
    name: "Alcance Limitado"
    description: >-
      La cadencia cierra solo una unidad pequeña (una idea básica, una codetta,
      una idea dentro de una presentación compuesta) y no tiene fuerza de cierre
      a nivel de frase o de tema.

  # PhraseClosure
  - id: ClosesSentence
    name: "Cierra una Sentencia"
  - id: ClosesPeriod
    name: "Cierra un Período"
  - id: ClosesHybridTheme
    name: "Cierra un Tema Híbrido"
  - id: ClosesContinuation
    name: "Cierra una Continuación"
  - id: ClosesAntecedent
    name: "Cierra un Antecedente"
  - id: ClosesConsequent
    name: "Cierra un Consecuente"

  # ThemeClosure
  - id: ClosesMainTheme
    name: "Cierra un Tema Principal"
  - id: ClosesTransition
    name: "Cierra una Transición"
  - id: ClosesSubordinateTheme
    name: "Cierra un Tema Subordinado"
  - id: ClosesCoda
    name: "Cierra una Coda"

  # IACSopranoDegree
  - id: SD3
    name: "Grado 3"
  - id: SD5
    name: "Grado 5"

  # HalfCadenceShape
  - id: Basic
    name: "Simple (I–V)"
  - id: Converging
    name: "Convergente"
  - id: Expanding
    name: "Expansiva"

  # Stage1Components
  - id: Stage1Tonic
    name: "Tónica"
  - id: Stage1AppliedDominant
    name: "Dominante Secundaria de la Predominante"
    short_name: "Dominante Secundaria"
  - id: Stage1TonicSubstitute
    name: "Sustituto de la Tónica"
    description: "VI"

  # Stage2Components
  - id: Stage2SD4
    name: "Predominante sobre el Grado 4"
    short_name: "Sobre el Grado 4"
    description: "IV, ii, ii6, …"
  - id: Stage2SDSharp4
    name: "Predominante sobre el Grado ♯4"
    short_name: "Sobre el Grado ♯4"
    description: "V secundaria, sextas aumentadas, …"
