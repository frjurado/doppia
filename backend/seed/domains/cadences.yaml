domain: cadences

# ─────────────────────────────────────────────────────────────────────────────
# Property Schemas
# Declared first. The seed script merges PropertySchema / PropertyValue nodes
# before concept nodes, so the HAS_PROPERTY_SCHEMA edges can be resolved in a
# single pass.
#
# Cardinality rules (ADR-019):
#   ONE_OF  — mutually exclusive; must have ≥1 value
#   MANY_OF — multi-select; must have ≥1 value
#   BOOL    — implicit true/false toggle; must have zero values
#
# Reference: docs/seed-drafts/cadences-design.md § "Property schemas"
# ─────────────────────────────────────────────────────────────────────────────

property_schemas:

  # ── Cadence-level schemas ────────────────────────────────────────────────

  - id: CadenceFunction
    name: "Cadence Function"
    description: >-
      The functional weight of the cadence within its formal context. Mutually
      exclusive; each value carries its own description.
    cardinality: ONE_OF
    required: true
    values:
      - id: LimitedScope
        name: "Limited Scope"
        description: >-
          The cadence closes only a small unit (a basic idea, a codetta, an idea
          within a compound presentation) and has no closing force at the level
          of the phrase or theme.
        order: 1
      - id: WayStation
        name: "Way Station"
        description: >-
          The cadence appears where a PAC is expected and puts that closure off,
          whether or not the PAC eventually arrives.
        order: 2
      - id: Independent
        name: "Independent"
        description: >-
          The cadence closes its unit on its own terms and does not stand in for
          a PAC.
        order: 3

  - id: PhraseClosure
    name: "Phrase Closure"
    description: >-
      The phrase-level formal unit this cadence closes. Only meaningful when
      CadenceFunction is Independent. Multiple values permitted (e.g. a cadence
      that closes both a Period and the Consequent). Each value references a
      Formal Function stub. Deliberately restricted to a stable Caplinian subset;
      see cadences-design.md § "Seeding strategy for formal-function closure".
    cardinality: MANY_OF
    required: false
    values:
      - id: ClosesSentence
        name: "Closes a Sentence"
        order: 1
        references: Sentence
      - id: ClosesPeriod
        name: "Closes a Period"
        order: 2
        references: Period
      - id: ClosesHybridTheme
        name: "Closes a Hybrid Theme"
        order: 3
        references: HybridTheme
      - id: ClosesContinuation
        name: "Closes a Continuation"
        order: 4
        references: Continuation
      - id: ClosesAntecedent
        name: "Closes an Antecedent"
        order: 5
        references: Antecedent
      - id: ClosesConsequent
        name: "Closes a Consequent"
        order: 6
        references: Consequent

  - id: ThemeClosure
    name: "Theme Closure"
    description: >-
      The theme-level formal unit this cadence closes. Only meaningful when
      CadenceFunction is Independent. Multiple values permitted. Each value
      references a Formal Function stub. Deliberately restricted to a stable
      Caplinian subset; see cadences-design.md § "Seeding strategy for
      formal-function closure".
    cardinality: MANY_OF
    required: false
    values:
      - id: ClosesMainTheme
        name: "Closes a Main Theme"
        order: 1
        references: MainTheme
      - id: ClosesTransition
        name: "Closes a Transition"
        order: 2
        references: Transition
      - id: ClosesSubordinateTheme
        name: "Closes a Subordinate Theme"
        order: 3
        references: SubordinateTheme
      - id: ClosesCoda
        name: "Closes a Coda"
        order: 4
        references: Coda

  - id: ECP
    name: "Expanded Cadential Progression"
    description: >-
      True when the cadential function spans at least a full phrase. As a rule
      of thumb: four real bars or more for authentic and deceptive cadences,
      three or more for half and evaded cadences, counting the final stage as
      one bar. Confirm it where real and notated bars differ.
    cardinality: BOOL
    required: false

  - id: Elided
    name: "Elided"
    description: >-
      True when the cadential arrival is also the first event of the next unit,
      so that the end of one unit and the beginning of the next coincide.
      Applies to realised and deceptive cadences (an elided deceptive cadence
      groups both backward and forward). An evaded cadence is never elided: its
      would-be arrival belongs only to what follows.
    cardinality: BOOL
    required: false

  - id: Covered
    name: "Covered"
    description: >-
      True when an elided perfect authentic cadence is hidden by the first
      melodic pitch of the next unit (usually scale degree 3 or 5), which sounds
      above the cadential scale degree 1 and makes the PAC look like an IAC.
      Also covers the inverse case: an IAC whose scale degree 3 is covered by 1.
    cardinality: BOOL
    required: false

  # ── Subtype-level schemas ────────────────────────────────────────────────

  - id: ReinterpretedAsHC
    name: "Reinterpreted as Half Cadence"
    description: >-
      True when an authentic cadence closes in the dominant key area and,
      because the home key comes straight back, is heard in retrospect as a half
      cadence in the home key. The two-event case (where a subsequent separate
      half cadence undoes the AC's closure) is modelled as the
      ReopeningHalfCadence concept, not as this property.
    cardinality: BOOL
    required: false

  - id: IACSopranoDegree
    name: "IAC Soprano Scale Degree"
    description: >-
      The scale degree of the melody at the arrival of an IAC. Scale degree 3 is
      the norm. Scale degree 5 is highly exceptional in the Classical style:
      consider a covered PAC first, and give the argument in the commentary.
    cardinality: ONE_OF
    required: false
    values:
      - id: SD3
        name: "Scale Degree 3"
        order: 1
      - id: SD5
        name: "Scale Degree 5"
        order: 2

  - id: PrinnerCadence
    name: "Prinner Cadence"
    description: >-
      True when an IAC carries a Prinner melody (scale degrees 6-5-4-3) over a
      standard cadential bass (4-5-1). Common in the galant style.
    cardinality: BOOL
    required: false

  - id: DeceptiveSD3
    name: "Deceptive Cadence (3̂)"
    description: >-
      True when the melody of a deceptive cadence ends on scale degree 3 rather
      than 1, so that it deviates from an implied IAC, not a PAC.
    cardinality: BOOL
    required: false

  - id: HalfCadenceShape
    name: "Half Cadence Shape"
    description: >-
      How the bass approaches the dominant. Simple (I-V): no pre-dominant.
      Converging: the bass rises to scale degree 5 (through 4 and often raised 4)
      while the melody falls. Expanding: the bass falls to 5 (from 6 or lowered
      6) while the melody rises. MANY_OF because a voice exchange can turn one
      into the other within the pre-dominant.
    cardinality: MANY_OF
    required: false
    values:
      - id: Basic
        name: "Simple (I–V)"
        order: 1
      - id: Converging
        name: "Converging"
        order: 2
      - id: Expanding
        name: "Expanding"
        order: 3

  - id: Premature
    name: "Premature"
    description: >-
      True when the dominant arrives before the prevailing melodic,
      phrase-structural (for example, fragmentation) and textural processes have
      run their course, so the music is held on the dominant earlier than
      expected. Applies to final and terminal dominants, and also to a
      root-position triad that would otherwise read as a half cadence: tag that
      case as Dominant Arrival with Premature.
    cardinality: BOOL
    required: false

  # ── Stage-level schemas ──────────────────────────────────────────────────

  - id: Stage1Components
    name: "Stage 1 Components"
    description: >-
      The harmonic entities present in Stage 1 (Initial Tonic) of the cadence.
      Multiple values permitted. Each value references a Harmonic Function stub.
    cardinality: MANY_OF
    required: false
    values:
      - id: Stage1Tonic
        name: "Tonic"
        order: 1
        references: Tonic
      - id: Stage1AppliedDominant
        name: "Applied Dominant of Pre-dominant"
        short_name: "Applied Dominant"
        order: 2
        references: AppliedDominant
      - id: Stage1TonicSubstitute
        name: "Tonic Substitute"
        description: "VI"
        order: 3
        references: TonicSubstitute

  - id: Stage2Components
    name: "Stage 2 Components"
    description: >-
      The harmonic entities present in Stage 2 (Pre-dominant) of the cadence.
      Multiple values permitted. Each value references a Harmonic Function stub.
    cardinality: MANY_OF
    required: false
    values:
      - id: Stage2SD4
        name: "Pre-dominant on Scale Degree 4"
        short_name: "On Scale Degree 4"
        description: "IV, ii, ii6, …"
        order: 1
        references: SD4Predominant
      - id: Stage2SDSharp4
        name: "Pre-dominant on Raised Scale Degree ♯4"
        short_name: "On Scale Degree ♯4"
        description: "Applied V, augmented sixths, …"
        order: 2
        references: SDSharp4Predominant

  - id: Cadential64
    name: "Cadential 6-4"
    description: >-
      True when the cadential dominant (Stage 3) is preceded by a cadential 6-4
      elaboration. Modelled as a BOOL rather than a value in an elaboration
      bucket because the cadential 6-4 is a near-sub-stage of the dominant,
      structurally unlike heterogeneous elaborations. Any future Stage 3
      elaboration gets its own named BOOL (e.g. a dominant pedal). The
      CadentialSixFour concept in the harmonic-functions domain is the
      structural counterpart; a fragment with Cadential64=true is correlatable
      to it at the service layer.
    cardinality: BOOL
    required: false

# ─────────────────────────────────────────────────────────────────────────────
# Concepts
#
# Ordering: abstract root → authentic-cadence branch → half-cadence branch →
#           stage leaves → post-cadential.  BELONGS_TO edges are created
#           automatically by the seed script from each concept's domain field
#           and must not appear in the relationships list.
#
# PREREQUISITE_FOR edges are declared on the source concept alongside
# IS_SUBTYPE_OF / FOLLOWS (ADR-020).
#
# All CONTAINS entries carry required: false — morphological commitment lives
# in prose definitions, not in structural required-ness (hard-locked decision 4
# in cadences-design.md).
#
# expected_stages records what the theory expects, as data (ADR-042): stage id →
# expected | absent; an unlisted stage is optional. It is inherited down
# IS_SUBTYPE_OF, and it never blocks a submission. A stage is tagged only where
# its definition holds, so a deviation may legitimately have fewer stages.
#
# definition_reviewed (default false): set to true on a concept once its
# `definition` prose has passed the editorial review pass and may be shown
# verbatim on the public glossary page. While false, the glossary substitutes an
# "under editorial review" placeholder (Component 11 Step 2). Flipping the flag
# is editorial content work (Track M / Component 11 Part 4), not a code change.
#
# Bibliographic references are carried inline in the definition prose; only
# Cadence has one. A dedicated `references` field is the better shape, but the
# convention is deferred until a second domain needs it, so that one pass can
# settle it for the whole corpus of definitions at once. See cadences-design.md
# § "Terminology and prose conventions".
#
# Reference: docs/seed-drafts/cadences-design.md
# ─────────────────────────────────────────────────────────────────────────────

concepts:

  # ── Abstract root ──────────────────────────────────────────────────────────

  - id: Cadence
    name: "Cadence"
    domain: cadences
    type: CadenceType
    top_level_taggable: false
    definition: >-
      A close marking the end of a theme, or of a phrase within one, in tonal
      music. A cadence typically proceeds through a sequence of harmonic stages
      (initial tonic, pre-dominant, dominant) toward an arrival point. The
      specific morphology and outcome of the close determine the cadence
      subtype. Reference: Caplin, W. (2024). Cadence: A Study of Closure in
      Tonal Music. Oxford University Press.
    definition_reviewed: true
    contains:
      - target: CadentialInitialTonic
        order: 1
        required: false
        display_mode: stage
        containment_mode: contiguous
        default_weight: 1.0
      - target: CadentialPreDominant
        order: 2
        required: false
        display_mode: stage
        containment_mode: contiguous
        default_weight: 1.0
      - target: CadentialDominant
        order: 3
        required: false
        display_mode: stage
        containment_mode: contiguous
        default_weight: 1.0
    property_schemas:
      - schema: CadenceFunction
        order: 1
        group: "closure"
      - schema: PhraseClosure
        order: 2
        group: "closure"
      - schema: ThemeClosure
        order: 3
        group: "closure"
      # ECP stays inline and ungrouped: it is a genuine analytical property of
      # the cadence, asked on most fragments, not a rarity to be tucked away.
      - schema: ECP
        order: 11
    capture_extensions:
      # A review gate, not stored data: nothing lands in
      # summary.concept_extensions, because the harmony already lives in
      # movement_analysis. Its only effect is that approving a cadence fragment
      # requires every event in the fragment's range to carry reviewed: true.
      #
      # Declared once on the abstract root: check_concepts_have_harmony_gate
      # walks IS_SUBTYPE_OF ancestors, so every subtype inherits it — including
      # the evaded / abandoned / dominant-arrival family (§ 13A).
      - field: harmony
        type: harmony_gate
        required: true
        description: >-
          Harmony events in the fragment's range must be reviewed before
          approval.

  # ── Authentic-cadence branch ───────────────────────────────────────────────

  - id: AuthenticCadence
    name: "Authentic Cadence"
    domain: cadences
    type: CadenceType
    complexity: foundational
    top_level_taggable: false
    definition: >-
      A cadence whose dominant moves toward a final tonic event. Includes both
      realised forms (PAC, IAC) and deviations from the expected resolution
      (Deceptive, Evaded, Abandoned).
    definition_reviewed: true
    relationships:
      - type: IS_SUBTYPE_OF
        target: Cadence
    contains:
      - target: CadentialFinalTonic
        order: 4
        required: false
        display_mode: stage
        containment_mode: contiguous
        default_weight: 1.0
    property_schemas:
      # Rare enough to read as noise beside the rest (Component 11 triage item
      # 9), so these sit under one heading, last: the order values put them
      # after ECP, and the group makes them a block. Subtypes continue the run.
      - schema: Elided
        order: 12
        group: "other"

  - id: AuthenticCadenceRealised
    name: "Authentic Cadence (Realised)"
    domain: cadences
    type: CadenceType
    complexity: foundational
    top_level_taggable: false
    definition: >-
      An Authentic Cadence in which the expected final tonic is actually
      delivered. The differentia from the deviation subtypes is morphological:
      the cadence reaches a root-position tonic on the arrival point.
    definition_reviewed: true
    expected_stages:
      CadentialDominant: expected
      CadentialFinalTonic: expected
    relationships:
      - type: IS_SUBTYPE_OF
        target: AuthenticCadence
      - type: PREREQUISITE_FOR
        target: HalfCadenceRealised
      - type: PREREQUISITE_FOR
        target: DeceptiveCadence
      - type: PREREQUISITE_FOR
        target: EvadedCadence
      - type: PREREQUISITE_FOR
        target: AbandonedCadence
    property_schemas:
      - schema: ReinterpretedAsHC
        order: 4
      - schema: Covered
        order: 13
        group: "other"

  - id: PerfectAuthenticCadence
    name: "Perfect Authentic Cadence"
    aliases:
      - PAC
    domain: cadences
    type: CadenceType
    complexity: foundational
    top_level_taggable: true
    definition: >-
      A realised Authentic Cadence in which the soprano voice arrives on scale
      degree 1 and both V and I are in root position. The strongest cadential
      close in the tonal system.
    definition_reviewed: true
    relationships:
      - type: IS_SUBTYPE_OF
        target: AuthenticCadenceRealised
      - type: PREREQUISITE_FOR
        target: ImperfectAuthenticCadence

  - id: ImperfectAuthenticCadence
    name: "Imperfect Authentic Cadence"
    aliases:
      - IAC
    domain: cadences
    type: CadenceType
    complexity: foundational
    top_level_taggable: true
    definition: >-
      A realised Authentic Cadence whose soprano arrives on scale degree 3
      rather than 1. Weaker than a PAC; characteristic of the antecedent of a
      period, or of a Way Station towards a later PAC. An arrival on scale degree
      5 is highly exceptional in the Classical style, and such a passage can
      often be heard another way, for instance as a covered PAC.
    definition_reviewed: true
    relationships:
      - type: IS_SUBTYPE_OF
        target: AuthenticCadenceRealised
    property_schemas:
      - schema: IACSopranoDegree
        order: 4
      - schema: PrinnerCadence
        order: 14
        group: "other"

  - id: DeceptiveCadence
    name: "Deceptive Cadence"
    aliases:
      - Dec.Cad.
    domain: cadences
    type: CadenceType
    complexity: intermediate
    top_level_taggable: true
    definition: >-
      An Authentic Cadence whose dominant resolves to a substitute chord (most
      commonly VI, but others are possible) in place of the expected tonic.
      The cadential gesture is morphologically complete up to the dominant;
      the substitution occurs at the cadential arrival. Not to be confused with
      an Evaded Cadence: the Deceptive Cadence's arrival is the last event of
      the gesture, whereas the Evaded Cadence's would-be arrival is interrupted
      by a new beginning.
    definition_reviewed: true
    expected_stages:
      CadentialDominant: expected
      CadentialFinalTonic: expected
    relationships:
      - type: IS_SUBTYPE_OF
        target: AuthenticCadence
    property_schemas:
      - schema: DeceptiveSD3
        order: 14
        group: "other"

  - id: EvadedCadence
    name: "Evaded Cadence"
    aliases:
      - Ev.Cad.
    domain: cadences
    type: CadenceType
    complexity: intermediate
    top_level_taggable: true
    definition: >-
      An Authentic Cadence whose final tonic never arrives: at the moment it is
      expected, a new idea or phrase begins, so the event in that position belongs
      to what follows instead of closing what came before. That event is often
      I6, but almost any harmony can take the place, even a root-position tonic.
      An evaded cadence usually prompts a repetition of the preceding material
      (the "one more time" technique) that tries again for the cadence. Not to be
      confused with a Deceptive Cadence, whose substitute harmony is heard as the
      last event of the cadence.
    definition_reviewed: true
    expected_stages:
      CadentialDominant: expected
      CadentialFinalTonic: absent
    relationships:
      - type: IS_SUBTYPE_OF
        target: AuthenticCadence

  - id: AbandonedCadence
    name: "Abandoned Cadence"
    aliases:
      - Abnd.
    domain: cadences
    type: CadenceType
    complexity: advanced
    top_level_taggable: true
    definition: >-
      An Authentic Cadence whose progression is given up before it reaches its
      goal: the root-position dominant shifts to an inversion, the dominant
      arrives already inverted, or the pre-dominant leads to no cadential dominant
      at all. There may be no single moment of arrival, only a point where the
      cadential motion stops. Where the Evaded Cadence fails at the arrival, the
      Abandoned Cadence fails at the dominant.
    definition_reviewed: true
    expected_stages:
      CadentialFinalTonic: absent
    relationships:
      - type: IS_SUBTYPE_OF
        target: AuthenticCadence

  # ── Half-cadence branch ────────────────────────────────────────────────────

  - id: HalfCadence
    name: "Half Cadence (General)"
    domain: cadences
    type: CadenceType
    complexity: foundational
    top_level_taggable: false
    definition: >-
      A cadence that arrives on the dominant rather than the tonic. The
      cadential gesture closes on the cadential dominant, which is the arrival
      point and not a preparation for further resolution. Includes the Half
      Cadence proper and Dominant Arrival as a cadential deviation.
    definition_reviewed: true
    relationships:
      - type: IS_SUBTYPE_OF
        target: Cadence

  - id: HalfCadenceRealised
    name: "Half Cadence"
    aliases:
      - HC
    domain: cadences
    type: CadenceType
    complexity: foundational
    top_level_taggable: true
    definition: >-
      A cadence that ends on a dominant in root position, without 7th, reached
      through a cadential progression — i.e. preceded by an initial tonic or
      pre-dominant function. The dominant ends its group and is heard as the
      goal, not as a penultimate harmony; a seventh or inversion after the
      arrival does not cancel it. Not to be confused with a Dominant Arrival, in
      which some of these traits are not present.
    definition_reviewed: true
    expected_stages:
      CadentialDominant: expected
    relationships:
      - type: IS_SUBTYPE_OF
        target: HalfCadence
      - type: PREREQUISITE_FOR
        target: DominantArrival
    property_schemas:
      - schema: HalfCadenceShape
        order: 4

  - id: ReopeningHalfCadence
    name: "Reopened Half Cadence"
    aliases:
      - "HC (reopened)"
    domain: cadences
    type: CadenceType
    complexity: advanced
    top_level_taggable: true
    definition: >-
      A Half Cadence that retrospectively undoes the closure of a preceding
      Authentic or Deceptive Cadence: the earlier cadence appears to close, but a
      subsequent arrival on the dominant reopens the cadential process and
      assumes the cadential weight.
    definition_reviewed: true
    relationships:
      - type: IS_SUBTYPE_OF
        target: HalfCadenceRealised
      - type: FOLLOWS
        target: AuthenticCadenceRealised
      - type: FOLLOWS
        target: DeceptiveCadence
    capture_extensions:
      - field: prior_ac_pointer
        type: fragment_pointer
        required: true
        description: >-
          The authentic or deceptive cadence fragment whose closure this half
          cadence reopens.

  - id: DominantArrival
    name: "Dominant Arrival"
    aliases:
      - Dom.Arr.
    domain: cadences
    type: CadenceType
    complexity: advanced
    top_level_taggable: true
    definition: >-
      A deviation of the Half Cadence: a unit ends on the dominant without forming
      a genuine half cadence. Either the final dominant of a cadential progression
      carries a seventh, or the dominant is the last harmony of a progression that
      prolongs or sequences rather than cadences, in which case it may even be
      inverted. When the dominant arrives before the melody, the phrase structure
      and the texture have run their course, the arrival is premature, and then
      even a root-position triad counts as a Dominant Arrival.
    definition_reviewed: true
    relationships:
      - type: IS_SUBTYPE_OF
        target: HalfCadence
    property_schemas:
      - schema: Premature
        order: 4

  # ── Stage leaf concepts ────────────────────────────────────────────────────
  # Stage concepts are CONTAINS children of Cadence/AuthenticCadence. They are
  # not IS_SUBTYPE_OF anything; their BELONGS_TO edge is auto-created from
  # domain: cadences. top_level_taggable: false per ADR-011 §5 override: these
  # have no analytical meaning outside a parent cadence; prolonged dominants
  # outside a cadential context live in the Prolongation domain.

  - id: CadentialInitialTonic
    name: "Initial Tonic"
    domain: cadences
    top_level_taggable: false
    definition: >-
      Stage 1 of a cadence: the opening tonic region from which the cadential
      motion departs. May consist of a tonic harmony alone, a tonic substitute
      (VI), an applied dominant of the pre-dominant, or a succession of these.
    definition_reviewed: true
    property_schemas:
      - schema: Stage1Components
        order: 1

  - id: CadentialPreDominant
    name: "Pre-dominant"
    domain: cadences
    top_level_taggable: false
    definition: >-
      Stage 2 of a cadence: the pre-dominant function preceding the cadential
      dominant. May include scale degree 4, frequently in the bass (subdominant
      family: IV, ii, ii6, …), raised scale degree 4 (applied dominants of V,
      augmented sixths), or both in succession.
    definition_reviewed: true
    property_schemas:
      - schema: Stage2Components
        order: 1

  - id: CadentialDominant
    name: "Dominant"
    domain: cadences
    top_level_taggable: false
    definition: >-
      Stage 3 of a cadence: the cadential dominant, a root-position V or V7,
      optionally preceded by a cadential 6-4. In a Half Cadence it is the arrival
      point and must be a triad; in an Authentic Cadence it prepares the final
      tonic (Stage 4). An inverted dominant is not cadential, so it is not this
      stage: an Abandoned Cadence or a Dominant Arrival built on one has no
      Stage 3.
    definition_reviewed: true
    property_schemas:
      - schema: Cadential64
        order: 1

  - id: CadentialFinalTonic
    name: "Final Tonic"
    domain: cadences
    top_level_taggable: false
    definition: >-
      Stage 4 of a cadence: the tonic arrival in an Authentic Cadence (or the
      substitute chord in a Deceptive Cadence). Absent in Half Cadences and in
      Evaded or Abandoned Authentic Cadences.
    definition_reviewed: true

  # ── Post-cadential concepts ────────────────────────────────────────────────
  # Top-level concepts in the cadence domain. Not IS_SUBTYPE_OF any cadence;
  # they follow one via FOLLOWS and are tagged on the fragment that immediately
  # succeeds the cadential fragment. The prior_cadence_pointer capture extension
  # links back to the preceding cadence fragment at tagging time.

  - id: ClosingSection
    name: "Closing Section"
    domain: cadences
    type: FormalUnit
    complexity: intermediate
    top_level_taggable: true
    definition: >-
      A post-cadential section that follows a realised Authentic Cadence,
      prolonging the tonic with closing material before the next phrase or theme
      begins. Distinguished from a new theme by its rhetorical and harmonic
      dependence on the prior cadence: it is heard as coming after an ending
      rather than as a new beginning, and its harmony prolongs the tonic just reached.
    definition_reviewed: true
    relationships:
      - type: FOLLOWS
        target: AuthenticCadenceRealised
    capture_extensions:
      - field: prior_cadence_pointer
        type: fragment_pointer
        required: true
        description: >-
          The prior realised authentic-cadence fragment id. Pre-populated from
          the nearest preceding tagged realised AC.

